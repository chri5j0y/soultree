<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Tree has moved | Grounded</title>
<meta name="description" content="Soul Tree by Grounded now lives at growwithgrounded.com/soul-tree.">
<link rel="canonical" href="https://growwithgrounded.com/soul-tree/">
<meta property="og:title" content="Soul Tree by Grounded">
<meta property="og:url" content="https://growwithgrounded.com/soul-tree/">
<meta property="og:image" content="https://growwithgrounded.com/soul-tree/share-image.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF7F2;color:#2C1810;font-family:Georgia,serif;text-align:center;padding:24px;box-sizing:border-box;}
h1{font-size:28px;margin:0 0 8px;} p{margin:0;color:#6B5A4D;font-family:system-ui,sans-serif;font-size:17px;line-height:1.5;} a{color:#8B5E1A;}
@media (prefers-color-scheme: dark){body{background:#1F1A14;color:#F3EDE3;}p{color:#C2B6A4;}a{color:#D9A847;}}
</style>
</head>
<body>
<main>
<h1 id="t">Soul Tree has a new home</h1>
<p id="m">Bringing your saved progress along. Everything stays on this device.</p>
<noscript><p><a href="https://growwithgrounded.com/soul-tree/">Go to growwithgrounded.com/soul-tree</a></p></noscript>
</main>
<script>
/* Soul Tree moved to growwithgrounded.com/soul-tree.
   This page carries anything saved at this old address over to the new one, on this device only.
   The old copy is left untouched here as a safety net. */
(function () {
  var NEW = 'https://growwithgrounded.com';
  var PATH = 'soul-tree';
  var KEYS = /^(sprout:|sapling_|soul-tree:|tending-the-garden|gg_read_|gg_theme)/;
  var hash = (location.hash || '').replace(/^#/, '').replace(/[^\w-]/g, '');
  var dest = NEW + '/' + PATH + '/' + (hash ? '#' + hash : '');
  function go() { location.replace(dest); }
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (KEYS.test(k)) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  var moved = false; try { moved = localStorage.getItem('gg-moved-done') === '1'; } catch (e) {}
  if (moved || !Object.keys(data).length) { go(); return; }

  function done() { try { localStorage.setItem('gg-moved-done', '1'); } catch (e) {} go(); }

  async function viaLink() {
    var text = JSON.stringify(data), bytes = new TextEncoder().encode(text), mode = 'r';
    if (typeof CompressionStream !== 'undefined') {
      var st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(st).arrayBuffer()); mode = 'z';
    }
    var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    var b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    try { localStorage.setItem('gg-moved-done', '1'); } catch (e) {}
    location.replace(NEW + '/move-in.html?to=' + PATH + '#gg-move=' + mode + '.' + b64 + (hash ? '|' + hash : ''));
  }

  var finished = false;
  var f = document.createElement('iframe');
  f.style.display = 'none'; f.setAttribute('aria-hidden', 'true'); f.title = 'Moving saved progress';
  f.src = NEW + '/move-in.html';
  window.addEventListener('message', function (e) {
    if (e.origin !== NEW || !e.data) return;
    if (e.data.type === 'gg-move-ready') f.contentWindow.postMessage({ type: 'gg-move', data: data }, NEW);
    if (e.data.type === 'gg-move-ok' && !finished) { finished = true; done(); }
  });
  document.body.appendChild(f);
  setTimeout(function () { if (!finished) { finished = true; viaLink().catch(go); } }, 4000);
})();
</script>
</body>
</html>
